<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${'Estacionamento - ' + titulo}"></title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="topo" th:fragment="nav" th:with="pagina=${#execInfo.processedTemplateName}">
    <a class="pular-conteudo" href="#conteudo-principal">Pular para o conteúdo</a>
    <div class="linha-marca">
        <a class="marca" href="/painel"><span class="marca-simbolo" aria-hidden="true">P</span>Estacionamento</a>
        <button class="alternar-nav secundario" type="button" aria-expanded="true" aria-controls="nav-principal">Menu</button>
    </div>
    <div class="contexto-patio"><span aria-hidden="true">E</span><div>Estacionamento<small>Controle de entradas e saídas</small></div></div>
    <nav id="nav-principal" aria-label="Navegação principal">
        <div class="grupo-nav">
            <p>Operação</p>
            <a href="/painel" th:attr="aria-current=${pagina == 'painel' ? 'page' : null}">Painel</a>
            <a href="/veiculo/registrar-entrada" th:attr="aria-current=${pagina == 'registrar-entrada' ? 'page' : null}">Registrar Entrada</a>
            <a href="/veiculo/registrar-saida" th:attr="aria-current=${pagina == 'registrar-saida' ? 'page' : null}">Registrar Saída</a>
        </div>
        <div class="grupo-nav">
            <p>Consultas</p>
            <a href="/movimentacoes" th:attr="aria-current=${pagina == 'movimentacoes' ? 'page' : null}">Movimentações</a>
            <a href="/relatorios" th:attr="aria-current=${pagina == 'relatorios' ? 'page' : null}">Relatórios</a>
        </div>
        <div class="grupo-nav" th:if="${admin}">
            <p>Administração</p>
            <a href="/configuracoes" th:attr="aria-current=${pagina == 'configuracoes' ? 'page' : null}">Configurações</a>
            <a href="/usuarios" th:attr="aria-current=${pagina == 'usuarios' or pagina == 'usuario-editar' or pagina == 'cadastro' ? 'page' : null}">Usuários</a>
        </div>
    </nav>
    <div class="sessao">
        <div><strong th:text="${admin ? 'Admin' : 'Operador'}"></strong><span th:text="${emailAtual}"></span></div>
        <form method="post" th:action="@{/logout}"><button class="secundario" type="submit">Sair</button></form>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const conteudo = document.querySelector('main');
            if (conteudo) {
                conteudo.id = 'conteudo-principal';
                conteudo.tabIndex = -1;
            }
            const topo = document.querySelector('.topo');
            const botao = topo.querySelector('.alternar-nav');
            const celular = window.matchMedia('(max-width: 760px)');
            const abrirMenu = (abrir) => {
                topo.toggleAttribute('data-nav-fechada', !abrir);
                botao.setAttribute('aria-expanded', String(abrir));
            };
            abrirMenu(!celular.matches);
            celular.addEventListener('change', () => abrirMenu(!celular.matches));
            botao.addEventListener('click', () => abrirMenu(botao.getAttribute('aria-expanded') !== 'true'));
        });
    </script>
</header>
<div th:fragment="mensagens">
    <p class="mensagem erro" role="alert" th:if="${erro}" th:text="${erro}"></p>
    <p class="mensagem" role="status" th:if="${notificacoes == true and mensagem != null}" th:text="${mensagem}"></p>
</div>
<div class="campos" th:fragment="dadosUsuario">
    <div><label for="inputNomeCadastro">Nome</label><input id="inputNomeCadastro" th:field="*{inputNomeCadastro}" required maxlength="120" autocomplete="name"></div>
    <div><label for="inputEmailCadastro">Email</label><input id="inputEmailCadastro" type="email" th:field="*{inputEmailCadastro}" required maxlength="200" autocomplete="email"></div>
    <div><label for="inputCPFCadastro">CPF (11 dígitos)</label><input id="inputCPFCadastro" th:field="*{inputCPFCadastro}" required inputmode="numeric" pattern="[0-9]{11}" maxlength="11"></div>
    <div><label for="inputTelefone">Telefone</label><input id="inputTelefone" type="tel" th:field="*{inputTelefone}" required pattern="[0-9]{10,11}" maxlength="11" autocomplete="tel"></div>
    <div><label for="inputDataNascimentoCadastro">Data de nascimento</label><input id="inputDataNascimentoCadastro" type="date" th:field="*{inputDataNascimentoCadastro}" required></div>
</div>
</body></html>

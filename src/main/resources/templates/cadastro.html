<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Estacionamento - Cadastro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #050507;
            padding: 25px 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(150, 100, 255, 0.035) 1px, transparent 1px),
                linear-gradient(90deg, rgba(150, 100, 255, 0.035) 1px, transparent 1px);
            background-size: 55px 55px;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            top: -250px;
            left: 50%;
            transform: translateX(-50%);
            background: radial-gradient(
                circle,
                rgba(125, 80, 255, 0.18) 0%,
                rgba(100, 60, 220, 0.08) 35%,
                transparent 70%
            );
            pointer-events: none;
        }

        form {
            background: rgba(12, 12, 17, 0.95);
            backdrop-filter: blur(15px);
            padding: 38px 40px 32px;
            border-radius: 18px;
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            border: 1px solid rgba(155, 110, 255, 0.22);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.65),
                0 0 50px rgba(120, 70, 255, 0.08);
            animation: slideUp 0.6s ease-out;
            transition: 0.3s ease;
        }

        form:hover {
            border-color: rgba(155, 110, 255, 0.4);
            box-shadow:
                0 30px 80px rgba(0, 0, 0, 0.75),
                0 0 60px rgba(120, 70, 255, 0.13);
        }

        form::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: linear-gradient(
                90deg,
                transparent,
                #9a6cff,
                transparent
            );
            box-shadow: 0 0 20px rgba(154, 108, 255, 0.8);
        }

        h2 {
            color: #f5f3ff;
            font-size: 29px;
            font-weight: 600;
            text-align: center;
            margin: 8px 0 28px;
            letter-spacing: 1px;
        }

        h2::after {
            content: '';
            display: block;
            width: 45px;
            height: 3px;
            margin: 11px auto 0;
            border-radius: 5px;
            background: linear-gradient(90deg, #7650d9, #b18cff);
            box-shadow: 0 0 15px rgba(150, 100, 255, 0.5);
        }

        h4 {
            color: #888391;
            font-size: 13px;
            font-weight: 500;
            margin: 3px 0 7px;
            letter-spacing: 0.3px;
        }

        h3 {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            font-weight: 400;
            color: #777481;
        }

        h3 a {
            color: #a984ff;
            text-decoration: none;
            font-weight: 600;
            transition: 0.3s ease;
        }

        h3 a:hover {
            color: #c2a9ff;
            text-shadow: 0 0 12px rgba(170, 130, 255, 0.4);
        }

        input {
            width: 100%;
            padding: 12px 15px;
            margin: 6px 0 13px;
            border: 1px solid #292732;
            border-radius: 9px;
            font-size: 14px;
            background: #101016;
            color: #eeeaff;
            outline: none;
            font-family: inherit;
            transition: 0.3s ease;
            animation: fadeIn 0.5s ease-out forwards;
            opacity: 0;
        }

        input:nth-child(1) {
            animation-delay: 0.1s;
        }

        input:nth-child(2) {
            animation-delay: 0.2s;
        }

        input:nth-child(3) {
            animation-delay: 0.3s;
        }

        input:nth-child(4) {
            animation-delay: 0.4s;
        }

        input:nth-child(5) {
            animation-delay: 0.5s;
        }

        input:nth-child(6) {
            animation-delay: 0.6s;
        }

        input:focus {
            border-color: #9068e8;
            background: #12121a;
            box-shadow:
                0 0 0 3px rgba(144, 104, 232, 0.08),
                0 0 20px rgba(144, 104, 232, 0.08);
        }

        input:hover {
            border-color: #3b3549;
        }

        input::placeholder {
            color: #777382;
        }

        input[type="date"] {
            color: #777382;
            cursor: pointer;
        }

        input[type="date"]:focus {
            color: #eeeaff;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.65);
            cursor: pointer;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 7px;
            border: 1px solid rgba(177, 140, 255, 0.3);
            border-radius: 9px;
            background: linear-gradient(
                135deg,
                #6546a9,
                #8a61d1
            );
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        button[type="submit"]::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.15),
                transparent
            );
            transform: translateX(-100%);
            transition: 0.5s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            background: linear-gradient(
                135deg,
                #7351bb,
                #956be0
            );
            box-shadow:
                0 10px 30px rgba(120, 75, 220, 0.25),
                0 0 20px rgba(140, 90, 240, 0.12);
        }

        button[type="submit"]:hover::before {
            transform: translateX(100%);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 20px 15px;
            }

            form {
                padding: 32px 22px 28px;
            }

            h2 {
                font-size: 26px;
            }

            input {
                padding: 11px 13px;
                font-size: 13px;
            }

            button[type="submit"] {
                padding: 13px;
            }
        }
    </style>
</head>
<body>

<form method="post" action="/efetuarCadastro">
    <h2>Cadastro</h2>

    <input type="text" name="inputNomeCadastro" id="inputNome" placeholder="Insira seu nome">
    <input type="number" name="inputCPFCadastro" id="inputCPF" placeholder="Insira seu CPF">
    <input type="email" id="inputEmailCadastro" name="inputEmailCadastro" placeholder="Insira seu email">
    <input type="password" id="inputSenhaCadastro" name="inputSenhaCadastro" placeholder="Insira sua senha">

    <h4>Insira sua data de nascimento</h4>

    <input type="date" name="inputDataNascimentoCadastro" id="inputDataNascimento">

    <input type="number" name="inputTelefone" id="inputTelefone" placeholder="Insira seu telefone">

    <button type="submit">Cadastrar</button>

    <h3>Já tem cadastro? <a href="/">Clique aqui</a></h3>
</form>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cadastro')}"></head>
<body><th:block th:if="${conectado}"><header th:replace="~{fragments :: nav}"></header></th:block>
<main><section class="cartao">
    <h1 th:text="${baseNova ? 'Criar conta Admin' : 'Cadastrar usuário'}"></h1>
    <p th:if="${baseNova}" class="ajuda">A primeira conta administra os usuários e as configurações do estacionamento.</p>
    <div th:replace="~{fragments :: mensagens}"></div>
    <form method="post" th:action="@{/efetuarCadastro}" th:object="${dados}">
        <div th:replace="~{fragments :: dadosUsuario}"></div>
        <label for="inputSenhaCadastro">Senha (mínimo de 8 caracteres)</label><input type="password" id="inputSenhaCadastro" name="inputSenhaCadastro" required minlength="8" maxlength="72" autocomplete="new-password">
        <div th:unless="${baseNova}"><label for="papel">Papel</label><select id="papel" name="papel"><option value="OPERADOR">Operador</option><option value="ADMIN">Admin</option></select></div>
        <div class="acoes"><button type="submit">Cadastrar</button><a th:href="${conectado ? '/usuarios' : '/login'}">Voltar</a></div>
    </form>
</section></main></body></html>

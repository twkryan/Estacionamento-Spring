<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Estacionamento - Erro Login</title>
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #050507;
        padding: 20px;
        position: relative;
        overflow: hidden;
    }

    body::before {
        content: '';
        position: fixed;
        inset: 0;
        background:
            linear-gradient(rgba(150, 100, 255, 0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(150, 100, 255, 0.035) 1px, transparent 1px);
        background-size: 55px 55px;
        pointer-events: none;
    }

    body::after {
        content: '';
        position: fixed;
        width: 600px;
        height: 600px;
        top: -250px;
        left: 50%;
        transform: translateX(-50%);
        background: radial-gradient(
            circle,
            rgba(125, 80, 255, 0.18) 0%,
            rgba(100, 60, 220, 0.08) 35%,
            transparent 70%
        );
        pointer-events: none;
    }

    .container {
        background: rgba(12, 12, 17, 0.95);
        backdrop-filter: blur(15px);
        padding: 48px 55px;
        border-radius: 18px;
        max-width: 500px;
        width: 100%;
        position: relative;
        z-index: 1;
        text-align: center;
        border: 1px solid rgba(155, 110, 255, 0.22);
        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.65),
            0 0 50px rgba(120, 70, 255, 0.08);
        animation: shake 0.8s ease-in-out, slideUp 0.6s ease-out;
        transition: 0.3s ease;
    }

    .container:hover {
        border-color: rgba(155, 110, 255, 0.4);
        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.75),
            0 0 60px rgba(120, 70, 255, 0.13);
    }

    .container::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100px;
        height: 2px;
        background: linear-gradient(
            90deg,
            transparent,
            #9a6cff,
            transparent
        );
        box-shadow: 0 0 20px rgba(154, 108, 255, 0.8);
    }

    .error-icon {
        width: 65px;
        height: 65px;
        margin: 0 auto 22px;
        display: flex;
        justify-content: center;
        align-items: center;
        border-radius: 50%;
        background: rgba(229, 62, 62, 0.08);
        border: 1px solid rgba(229, 62, 62, 0.25);
        color: #ff6b6b;
        font-size: 30px;
        animation: pulse 1.5s ease-in-out infinite;
        box-shadow: 0 0 25px rgba(229, 62, 62, 0.08);
    }

    h1 {
        color: #f5f3ff;
        font-size: 26px;
        font-weight: 600;
        margin-bottom: 15px;
        letter-spacing: 0.5px;
    }

    h1::after {
        content: '';
        display: block;
        width: 55px;
        height: 3px;
        margin: 12px auto 0;
        border-radius: 5px;
        background: linear-gradient(
            90deg,
            #c94b4b,
            #ff7373
        );
        box-shadow: 0 0 15px rgba(229, 62, 62, 0.35);
    }

    .message {
        color: #85818f;
        font-size: 15px;
        line-height: 1.6;
        margin: 24px 0;
    }

    .btn-voltar {
        display: inline-block;
        background: linear-gradient(
            135deg,
            #6546a9,
            #8a61d1
        );
        color: white;
        text-decoration: none;
        padding: 13px 32px;
        border-radius: 9px;
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.5px;
        transition: 0.3s ease;
        border: 1px solid rgba(177, 140, 255, 0.3);
        position: relative;
        overflow: hidden;
    }

    .btn-voltar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,0.15),
            transparent
        );
        transform: translateX(-100%);
        transition: 0.5s ease;
    }

    .btn-voltar:hover {
        transform: translateY(-2px);
        background: linear-gradient(
            135deg,
            #7351bb,
            #956be0
        );
        box-shadow:
            0 10px 30px rgba(120, 75, 220, 0.25),
            0 0 20px rgba(140, 90, 240, 0.12);
    }

    .btn-voltar:hover::before {
        transform: translateX(100%);
    }

    .btn-voltar:active {
        transform: translateY(0);
    }

    @keyframes slideUp {
        from {
            opacity: 0;
            transform: translateY(30px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    @keyframes shake {
        0%, 100% {
            transform: translateX(0);
        }

        10% {
            transform: translateX(-8px);
        }

        20% {
            transform: translateX(8px);
        }

        30% {
            transform: translateX(-7px);
        }

        40% {
            transform: translateX(7px);
        }

        50% {
            transform: translateX(-4px);
        }

        60% {
            transform: translateX(4px);
        }

        70% {
            transform: translateX(-2px);
        }

        80% {
            transform: translateX(2px);
        }

        90% {
            transform: translateX(-1px);
        }
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
        }

        50% {
            transform: scale(1.08);
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 35px 22px;
        }

        .error-icon {
            width: 55px;
            height: 55px;
            font-size: 25px;
        }

        h1 {
            font-size: 22px;
        }

        .message {
            font-size: 14px;
        }

        .btn-voltar {
            width: 100%;
            padding: 12px 25px;
            font-size: 13px;
        }
    }
  </style>
</head>
<body>

<div class="container">
  <span class="error-icon">❌</span>

  <h1>Usuário ou senha inválido!</h1>

  <p class="message">
    Por favor, verifique suas credenciais e tente novamente.
  </p>

  <a href="/login" class="btn-voltar">↩ Voltar ao Login</a>
</div>

</body>
</html>

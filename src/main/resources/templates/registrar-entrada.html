<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Registrar Entrada')}"></head>
<body><header th:replace="~{fragments :: nav}"></header>
<main><section class="cartao"><h1>Registrar Entrada</h1>
    <form method="post" th:action="@{/veiculo/cadastrar}">
        <label for="placa">Placa</label><input type="text" id="placa" name="placa" placeholder="Ex: ABC1D23" required>
        <label for="modelo">Modelo</label><input type="text" id="modelo" name="modelo" placeholder="Ex: Honda Civic" required>
        <label for="cor">Cor</label><input type="text" id="cor" name="cor" placeholder="Ex: Preto" required>
        <label for="observacao">Observação</label><textarea id="observacao" name="observacao" placeholder="Digite alguma observação..."></textarea>
        <div class="acoes"><button type="submit">Registrar Entrada</button><a href="/painel">Voltar</a></div>
    </form>
</section></main></body></html>
